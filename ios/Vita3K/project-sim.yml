# Vita3K iOS shell app — SIMULATOR flavor.
# The core is built by CMake (preset ios-simulator) and staged by
# scripts/stage-core.sh simulator, which also (re)generates this project.
#
# Step 7: the MoltenVK v1.4.1 release ships no simulator slice, so this
# flavor force-loads a static lib built from the same source
# (scripts/build-moltenvk-sim.sh, staged to Vendor/MoltenVK-sim). The core
# dylib resolves vkGetInstanceProcAddr from this image at load time, exactly
# like the device flavor does with the XCFramework slice.

name: Vita3K
options:
  bundleIdPrefix: dev.vita3k
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "3"
      LLVM_LTO: YES_THIN

targets:
  Vita3K:
    type: application
    platform: iOS
    sources:
      - path: App/Vita3KApp.swift
      - path: App/Localization.swift
      - path: App/Resources
      - path: App/ContentView.swift
      - path: App/EmulatorTheme.swift
      - path: App/LibraryView.swift
      - path: App/SettingsView.swift
      - path: App/Vita3KCore.swift
      - path: App/ImportStore.swift
      - path: App/SaveSyncEngine.swift
      - path: App/CloudSaveSync.swift
      - path: App/GameConfigView.swift
      - path: App/EmulationViewController.swift
      - path: App/PerformanceOverlay.swift
      - path: App/GameKeyboardView.swift
      - path: App/Assets.xcassets
      # Core immutable resources (step 6): same .spv shader binaries as the
      # device flavor (they are only compiled when a MoltenVK device exists).
      - path: ../../vita3k/shaders-builtin
        type: folder
        buildPhase: resources
      - path: ../../vita3k/icons
        type: folder
        buildPhase: resources
      # NOTE: libVita3KCore.dylib is NOT a resource. The preBuild script copies
      # + signs it into Frameworks/ (the executable's rpath, ad-hoc on simulator).
    preBuildScripts:
      - name: Stage Vita3KCore
        inputFiles:
          - "$(SRCROOT)/Vendor/libVita3KCore.dylib"
          - "$(SRCROOT)/Vendor/libVita3KCore.dylib.build-config"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Frameworks/libVita3KCore.dylib"
        script: |
          set -e
          CORE_CONFIG="$(cat "${SRCROOT}/Vendor/libVita3KCore.dylib.build-config")"
          if [ "${CONFIGURATION}" = "Release" ] && [ "$CORE_CONFIG" != "Release" ]; then
            echo "error: Release app requires a Release core (staged: $CORE_CONFIG). Rebuild with cmake --preset ios-simulator, then build and stage the core."
            exit 1
          fi
          APP="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "$APP/Frameworks"
          cp "${SRCROOT}/Vendor/libVita3KCore.dylib" "$APP/Frameworks/libVita3KCore.dylib"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            if [ "${PLATFORM_NAME}" = "iphoneos" ]; then
              ID="$(security find-identity -v -p codesigning | grep -m1 'Apple Development' | sed 's/^[^"]*"\([^"]*\)".*/\1/')"
              [ -n "$ID" ] || { echo "no developer identity found"; exit 1; }
            else
              ID="-"
            fi
            xcrun codesign --force --sign "$ID" "$APP/Frameworks/libVita3KCore.dylib"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vita3k.Vita3KIos
        ICLOUD_CONTAINER_IDENTIFIER: iCloud.dev.vita3k.Vita3KIos
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The staged core dylib and MoltenVK slice are arm64-only; pin the
        # app to arm64 in every configuration (Release defaults to
        # ONLY_ACTIVE_ARCH=NO and would also build x86_64, which then fails
        # to link the arm64 libraries).
        ARCHS: arm64
        SUPPORTED_ARCHS: arm64
        ENABLE_TESTABILITY: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/include"
        OTHER_LDFLAGS:
          - "-L$(SRCROOT)/Vendor"
          - "-lVita3KCore"
          # Step 7: force-load the source-built MoltenVK simulator slice
          # (MoltenVK + ShaderConverter + Common + SPIRV-Cross combined).
          # The core dylib references vkGetInstanceProcAddr via dynamic
          # lookup; nothing in the app references Vulkan symbols directly,
          # so a plain -l would pull in no objects and dyld would refuse to
          # load the core on the simulator (same fix as the device flavor).
          - "-force_load"
          - "$(SRCROOT)/Vendor/MoltenVK-sim/libMoltenVK.a"
          - "-lc++"
    entitlements:
      path: App/Vita3K.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: ["$(ICLOUD_CONTAINER_IDENTIFIER)"]
        com.apple.developer.ubiquity-container-identifiers: ["$(ICLOUD_CONTAINER_IDENTIFIER)"]
        com.apple.developer.icloud-services: [CloudDocuments]

  Vita3KInputTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InputTests
    dependencies:
      - target: Vita3K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vita3k.Vita3KIos.InputTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vita3K.app/Vita3K"
        BUNDLE_LOADER: "$(TEST_HOST)"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/include"
        ARCHS: arm64

  Vita3KUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Vita3K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vita3k.Vita3KIos.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vita3K
        ARCHS: arm64

schemes:
  Vita3K:
    build:
      targets:
        Vita3K: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - Vita3KInputTests
        - Vita3KUITests
